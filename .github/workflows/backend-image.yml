name: backend-image

# main → :latest + :sha-<commit>   (the nightly auto-updater follows :latest)
# feat/flexible-deploy → :pilot + :sha-<commit>   (never :latest)
on:
  push:
    branches: [main, feat/flexible-deploy]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/dfergo/cbc-backend:${{ github.ref_name == 'main' && 'latest' || 'pilot' }}
            ghcr.io/dfergo/cbc-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
