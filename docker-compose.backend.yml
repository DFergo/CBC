# Pull-inverse architecture (HRDD parity): the backend polls each frontend's
# backend port (container port 8080) at the URL the admin registered in the
# Frontends tab — LAN IP, hostname, Tailscale name or a tunnel hostname. For a
# frontend on the same host over a shared internal network, see deploy/t3-same-host.
#
# Host port is configurable via BACKEND_PORT (default 8100). Override
# via Portainer's Environment variables without editing the compose.
# Container port stays 8000 internally.
#
# No explicit container_name: Portainer prefixes containers with the stack
# name, so multiple stacks can coexist on one host without colliding.
services:
  cbc-backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # true = local embedding/reranker models baked in (zero-config RAG);
        # false = smaller image, embeddings/reranking via an API connection.
        INSTALL_LOCAL_MODELS: ${INSTALL_LOCAL_MODELS:-true}
    ports:
      - "${BACKEND_PORT:-8100}:8000"
    volumes:
      - cbc-data:/app/data
    environment:
      - DEPLOYMENT_JSON_PATH=/app/config/deployment_backend.json
      - CBC_DATA_DIR=/app/data
      # Installation-wide signing secret (≥ 32 chars, e.g. `openssl rand -hex 32`): used for
      # every signed frontend without its own secret. Same value as CBC_BACKEND_SECRET on
      # those frontends. Optional — without it, signed frontends need their own secret.
      - CBC_FRONTEND_SECRET=${CBC_FRONTEND_SECRET:-}

volumes:
  cbc-data:
