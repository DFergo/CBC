# T1 — frontend on another machine of the same LAN as the backend.
#
# The backend reaches the backend surface over the LAN: BACKEND_BIND must be this
# machine's LAN IP (not 0.0.0.0 if the machine has any other interface).
# Users reach the public port through a cloudflared tunnel running on this machine
# (map ONLY http://localhost:${FRONTEND_PORT} in the tunnel) or directly on the LAN.
# Register in the backend: URL http://<BACKEND_BIND>:<FRONTEND_BACKEND_PORT> + the secret.
#
#   cp .env.example .env   # fill in
#   docker compose up -d

services:
  cbc-frontend:
    image: ghcr.io/dfergo/cbc-frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PUBLIC_BIND:-127.0.0.1}:${FRONTEND_PORT:?set FRONTEND_PORT}:80"
      - "${BACKEND_BIND:?set BACKEND_BIND to this machine's LAN IP}:${FRONTEND_BACKEND_PORT:?set FRONTEND_BACKEND_PORT}:8080"
    volumes:
      - cbc-frontend-data:/app/data
    environment:
      - BACKEND_SURFACE_AUTH=${BACKEND_SURFACE_AUTH:-signed}
      - CBC_BACKEND_SECRET=${CBC_BACKEND_SECRET:-}
      - CBC_BACKEND_SECRET_PREVIOUS=${CBC_BACKEND_SECRET_PREVIOUS:-}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

volumes:
  cbc-frontend-data:
